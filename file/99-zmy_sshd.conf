# ==============================================
# OpenSSH 服务端配置文件 (custom.conf)
# 适用于新服务器快速部署，包含安全加固和常用功能
# ==============================================

# ----------------------------
# 基础连接配置
# ----------------------------
Port 10086                 # 监听端口（默认22，建议修改为其他端口防扫描）
AddressFamily inet       # 仅监听IPv4（若需IPv6，改为 `inet6` 或删除此行）
ListenAddress 0.0.0.0    # 监听所有IP（若需限制IP访问，改为具体IP）

# ----------------------------
# 协议与加密算法
# ----------------------------
Protocol 2               # 仅使用SSHv2，禁用不安全的SSHv1
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr  # 指定强加密算法
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com  # 指定强完整性校验算法
KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group-exchange-sha256  # 密钥交换算法

# ----------------------------
# 认证与权限控制
# ----------------------------
PermitRootLogin prohibit-password  # 禁止root密码登录（允许密钥登录）
PasswordAuthentication no         # 禁用密码认证（强制使用密钥）
PermitEmptyPasswords no           # 禁止空密码
PubkeyAuthentication yes          # 启用公钥认证
# AllowUsers user1 user2@192.168.1.0/24  # 仅允许指定用户/IP段登录（逗号分隔）
#DenyUsers baduser                 # 明确拒绝某些用户
#AllowGroups ssh-users             # 仅允许指定用户组

# ----------------------------
# 会话与超时
# ----------------------------
ClientAliveInterval 300   # 客户端无响应300秒后检查连接
ClientAliveCountMax 2     # 最多发送2次检查包后断开
LoginGraceTime 1m         # 登录超时时间（60秒）
MaxAuthTries 3            # 单次连接最大认证尝试次数

# ----------------------------
# 日志与审计
# ----------------------------
SyslogFacility AUTH       # 日志记录到系统auth日志
LogLevel VERBOSE          # 详细日志级别（可选 INFO）

# ----------------------------
# 高级安全配置
# ----------------------------
UsePAM yes                # 启用PAM认证模块（如启用Google Authenticator）
UseDNS no                 # 禁用DNS反向解析，加速登录
X11Forwarding no          # 禁用X11转发（除非必要）
AllowTcpForwarding no     # 禁用TCP端口转发（按需开启）
PermitTunnel no           # 禁用隧道功能

# ----------------------------
# SFTP 子系统配置
# ----------------------------
Subsystem sftp internal-sftp  # 启用内置SFTP服务

# 限制SFTP用户到指定目录（示例：用户组为sftp-users）
# Match Group sftp-users
#     ChrootDirectory /data/sftp/%u  # 动态目录（用户名变量%u）
#     ForceCommand internal-sftp      # 强制仅使用SFTP
#     AllowTcpForwarding no           # 禁用端口转发
#     X11Forwarding no                # 禁用X11
#     PermitTTY no                    # 禁用终端

# ----------------------------
# 其他优化
# ----------------------------
Compression no            # 禁用压缩（防攻击如CRIME）
MaxSessions 10            # 单用户最大并发会话数
MaxStartups 10:30:60      # 同时允许的未认证连接数（初始:速率:最大）